<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a09;
    --gold:#e6bd5e;
    --gold-2:#c08a2a;
    --gold-grad:linear-gradient(120deg,#f4d98a 0%,#e6bd5e 45%,#b9832a 100%);
    --white:#f6f2ea;
    --muted:#b9b0a2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* mesma proporção da capa original 1066x1600 -> 1080x1620 */
  body{width:1080px;height:1620px;background:var(--bg);color:var(--white);
    font-family:'Poppins',sans-serif;overflow:hidden;position:relative}

  /* fundo: vinheta + brilho dourado + brilho vermelho sutil (ecoa a blusa) */
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(900px 700px at 50% 24%,rgba(230,189,94,.20),transparent 62%),
      radial-gradient(760px 620px at 78% 40%,rgba(150,28,30,.28),transparent 60%),
      radial-gradient(760px 620px at 20% 46%,rgba(120,22,24,.20),transparent 60%),
      linear-gradient(180deg,#141110 0%,#0b0a09 55%,#080706 100%)}
  /* textura de linhas radiais douradas leves */
  .rays{position:absolute;inset:0;opacity:.10;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 34%,transparent 0deg,rgba(230,189,94,.9) .4deg,transparent 1.4deg 9deg)}
  .arc{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:1180px;height:1180px;
    border-radius:50%;border:2px solid rgba(230,189,94,.22);
    box-shadow:0 0 0 1px rgba(230,189,94,.10) inset}
  .arc2{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:940px;height:940px;
    border-radius:50%;border:1px solid rgba(230,189,94,.16)}

  .goldbar{position:absolute;top:0;left:0;right:0;height:14px;background:var(--gold-grad);z-index:6}

  /* logo patrocinador */
  .sponsor{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .sponsor .lbl{font-size:19px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sponsor img{height:118px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}

  /* foto */
  .hero{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:3;
    height:1275px;filter:drop-shadow(0 24px 50px rgba(0,0,0,.6))}
  /* piso de brilho sob ela */
  .floor{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:2;
    width:820px;height:150px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(230,189,94,.24),transparent 72%);filter:blur(6px)}

  /* textos */
  .txt{position:absolute;left:0;right:0;bottom:0;z-index:4;text-align:center;padding:0 70px 66px}
  .txt::before{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg,transparent 0%,rgba(8,7,6,.72) 34%,#080706 74%)}
  .ktrein{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:150px;line-height:.86;
    letter-spacing:.005em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
  .de{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0 12px}
  .de span{font-size:26px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .de i{height:2px;width:90px;background:linear-gradient(90deg,transparent,var(--gold-2))}
  .de i:last-child{background:linear-gradient(90deg,var(--gold-2),transparent)}
  .foco{font-family:'Anton',sans-serif;text-transform:uppercase;font-weight:400;
    font-size:70px;line-height:1.02;color:var(--white);letter-spacing:.01em}
  .who{margin-top:34px;display:flex;align-items:center;justify-content:center;gap:16px}
  .who .ln{height:1px;width:120px;background:linear-gradient(90deg,transparent,rgba(230,189,94,.5))}
  .who .ln:last-child{background:linear-gradient(90deg,rgba(230,189,94,.5),transparent)}
  .who img{height:64px}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="rays"></div>
  <div class="arc"></div>
  <div class="arc2"></div>
  <div class="goldbar"></div>

  <div class="sponsor">
    <span class="lbl">Apresenta</span>
    <img src="manmotors.png" alt="Man Motors S.A.">
  </div>

  <div class="floor"></div>
  <img class="hero" src="jocelaine-capa.png" alt="Jocelaine Rufatto">

  <div class="txt">
    <div class="ktrein">Treinamento</div>
    <div class="de"><i></i><span>de</span><i></i></div>
    <div class="foco">Gestão Financeira<br>e Gestão Comercial</div>
    <div class="who">
      <span class="ln"></span>
      <img src="logo-jr.png" alt="Jocelaine Rufatto">
      <span class="ln"></span>
    </div>
  </div>
</body>
</html>
